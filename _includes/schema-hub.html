{% comment %} Topic hub page: CollectionPage + BreadcrumbList. {% endcomment %}
{% assign sh_url = page.url | absolute_url %}
{% assign sh_hub = site.data.hubs | where: "slug", page.hub | first %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "CollectionPage",
      "@id": {{ sh_url | jsonify }},
      "url": {{ sh_url | jsonify }},
      "name": {{ page.title | jsonify }},
      "description": {{ page.description | jsonify }},
      "isPartOf": { "@id": {{ '/' | absolute_url | append: '#blog' | jsonify }} },
      "breadcrumb": { "@id": {{ sh_url | append: '#breadcrumb' | jsonify }} }
    },
    {
      "@type": "BreadcrumbList",
      "@id": {{ sh_url | append: '#breadcrumb' | jsonify }},
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Blog", "item": {{ '/' | absolute_url | jsonify }} },
        { "@type": "ListItem", "position": 2, "name": {{ sh_hub.name | jsonify }} }
      ]
    }
  ]
}
</script>
