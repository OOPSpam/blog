{% comment %} Author page: ProfilePage + Person (referenced by every post's BlogPosting author via @id). {% endcomment %}
{% assign sa_url = page.url | absolute_url %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "ProfilePage",
      "@id": {{ sa_url | jsonify }},
      "url": {{ sa_url | jsonify }},
      "name": {{ page.display_name | append: ' – ' | append: page.position | jsonify }},
      "mainEntity": { "@id": {{ sa_url | append: '#person' | jsonify }} },
      "breadcrumb": {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Blog", "item": {{ '/' | absolute_url | jsonify }} },
          { "@type": "ListItem", "position": 2, "name": {{ page.display_name | jsonify }} }
        ]
      }
    },
    {
      "@type": "Person",
      "@id": {{ sa_url | append: '#person' | jsonify }},
      "name": {{ page.display_name | jsonify }},
      "jobTitle": {{ page.position | jsonify }},
      "url": {{ sa_url | jsonify }},
      {% if page.avatar %}"image": {{ page.avatar | prepend: site.url | jsonify }},{% endif %}
      "description": {{ page.short_bio | jsonify }},
      "worksFor": { "@id": "https://www.oopspam.com/#organization" },
      "sameAs": {{ page.same_as | jsonify }}
    }
  ]
}
</script>
