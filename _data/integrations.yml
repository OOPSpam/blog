# "Related integration" box: the first rule whose `match` appears in the post title (lower case) wins.
# If none match, the post's hub default from _data/hubs.yml is used.
- { match: "woocommerce", url: "https://www.oopspam.com/woocommerce", name: "oopspam for WooCommerce", blurb: "Blocks fake orders, card testing and spam registrations at checkout." }
