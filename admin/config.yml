backend:
  name: github
  repo: OOPSpam/blog
  base_url:  https://sveltia-cms-auth.ratelimit.workers.dev/
media_folder: "/assets/posts"
public_folder: "/blog/assets/posts"
collections:
  - name: 'blog'
    label: 'Blog'
    folder: '_posts/'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    editor:
      preview: false
    fields:
      - { label: 'Layout', name: 'layout', widget: 'hidden', default: 'post' }
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime', hint: "Set once, when the post is first published. Don't change it when you update a post." }
      - { label: 'Last Updated', name: 'last_modified_at', widget: 'datetime', required: false, hint: "Filled in automatically each time you save changes to a published post. Shown as 'Updated' on the post and sent to Google." }
      - {
        label: 'Author',
        name: 'author',
        widget: 'relation',
        collection: 'authors',
        display_fields: [display_name],
        search_fields: [display_name],
        value_field: 'name',
        }
      - {
        label: 'Topic hub',
        name: 'hub',
        widget: 'select',
        required: false,
        hint: "Puts the post on that topic page and in the breadcrumb (Blog › Topic › Post). Leave empty if none fits.",
        options: [
          { label: 'WordPress forms', value: 'wordpress-forms' },
          { label: 'Email lists', value: 'email-lists' },
          { label: 'E-commerce fraud', value: 'ecommerce-fraud' },
          { label: 'Cloudflare, Turnstile & CAPTCHA', value: 'cloudflare-captcha' },
          { label: 'VPN, country blocking & rate limits', value: 'vpn-country-rate-limits' }
        ]
        }
      - { label: 'Meta image', name: 'image', widget: 'image' }
      - { label: 'Meta description', name: 'description', widget: 'string' }
      - { label: 'Tags', name: 'tags', widget: 'list' }
      - { label: 'Body', name: 'body', widget: 'markdown' }
  - name: 'authors'
    label: 'Authors'
    folder: '_authors/'
    create: true
    editor:
      preview: false
    fields:
      - { label: 'Layout', name: 'layout', widget: 'hidden', default: 'author' }
      - { label: 'Short Name', name: 'name', widget: 'string' }
      - { label: 'Display Name', name: 'display_name', widget: 'string' }
      - { label: 'Position', name: 'position', widget: 'string' }
      - { label: 'Avatar', name: 'avatar', widget: 'image' }
      - { label: 'LinkedIn URL', name: 'linkedin', widget: 'string', required: false }
      - { label: 'X (Twitter) URL', name: 'x', widget: 'string', required: false }
      - { label: 'Short bio', name: 'short_bio', widget: 'text', hint: "1–2 sentences. Shown in the bio box at the end of every post." }
      - { label: 'Profiles (for search engines)', name: 'same_as', widget: 'list', required: false, hint: "Full URLs of this person's public profiles, e.g. LinkedIn, X, an About page." }
      - { label: 'Body', name: 'body', widget: 'markdown' }